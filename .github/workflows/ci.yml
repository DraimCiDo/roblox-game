name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить инструменты из rokit.toml
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Установить Wally-пакеты
        run: wally install

      - name: Формат (StyLua)
        run: stylua --check src

      - name: Линтер (Selene)
        run: selene src

      - name: Сборка (Rojo)
        run: rojo build default.project.json -o build.rbxl

      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: place
          path: build.rbxl
          retention-days: 7
