name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Не делаем checkout кода из PR: pull_request_target запускается с правами записи.
      - uses: actions/labeler@v7
        with:
          sync-labels: true
